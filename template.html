<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>DipDoc</title>
	<!-- Theme lives in dipdoc.css (swappable). Override the :root vars or replace
	     the file to match another theme, e.g. stamat/poops — no HTML/JS edit. -->
	<link rel="stylesheet" href="dipdoc.css">
</head>
<body>
	<div class="layout">
		<nav id="nav"></nav>
		<main id="app">Loading&hellip;</main>
	</div>
	<!-- Generated data: `dipdoc <root> <langs> --test -o dipdoc.json -f js`
	     ('js' format wraps the JSON as `var dipdoc = {...}` and, with --test,
	     bakes each $assert's pass/fail into the data this reader renders). -->
	<script src="dipdoc.json"></script>
	<script src="dipdoc_reader.js"></script>
</body>
</html>
