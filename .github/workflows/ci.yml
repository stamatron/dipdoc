name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Node powers the $assert executor; without it those tests self-skip.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run tests
        run: python3 test_dipdoc.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        uses: astral-sh/ruff-action@v3
